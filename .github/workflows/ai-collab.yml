name: AI Collaboration Trigger Test

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  detect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.issue.number == 2)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Detect collaboration handoff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "PR: $PR_NUMBER"
          if [[ "$COMMENT_BODY" == *"ACK_BY_MUSE"* ]]; then
            echo "Detected Muse acknowledgement"
          elif [[ "$COMMENT_BODY" == *"WAITING_FOR_CHATGPT"* ]]; then
            echo "Detected ChatGPT handoff request"
          else
            echo "No matching handoff status"
          fi
